# data-service 容器编排参考（审计 B22 修订版）。
# 用法：数据主机上把本文件放到仓库根目录（与 data-service/ 同级）后执行
#   cp .env.example .env   → 填入真实值（.env 不入 git）
#   docker compose up -d
# 必填变量缺失时 compose 会直接报错退出（${VAR:?} 语义），不再回落到代码默认密码。
services:
  data-service:
    build: ./data-service
    container_name: data-service
    ports:
      - "8600:8600"
    environment:
      # 账户与密码为必填项：从 .env 注入，本文件不写任何真实/默认密码
      - DB_HOST=${DB_HOST:-biz-postgres}
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=${DB_NAME:-unmanned_supermarket}
      - DB_USER=${DB_USER:?DB_USER 未设置：请 cp .env.example .env 并填写}
      - DB_PASSWORD=${DB_PASSWORD:?DB_PASSWORD 未设置：请 cp .env.example .env 并填写与 biz-postgres 一致的密码}
      # 连接池上限受控，避免挤爆数据库
      - DB_POOL_MIN_SIZE=${DB_POOL_MIN_SIZE:-2}
      - DB_POOL_MAX_SIZE=${DB_POOL_MAX_SIZE:-10}
      # 注：LLM_API_KEY / LLM_BASE_URL / LLM_MODEL 已从本编排移除——
      # data-service 代码（config.py）不读取任何 LLM_* 变量，属死配置。
    networks:
      - unmanned-store_default
    restart: unless-stopped

networks:
  # ---- 外部前置条件（不由本 compose 拉起，启动前先确认）----
  # 1) 外部 PostgreSQL：容器 biz-postgres 已在运行，库 unmanned_supermarket、账户 appuser。
  #    它归属另一个 compose 项目（unmanned-store），本服务经下方外部网络访问它。
  #    验证：docker ps --filter name=biz-postgres
  # 2) 外部网络 unmanned-store_default 必须已存在（通常随 unmanned-store 项目自动创建）。
  #    验证：docker network ls | grep unmanned-store_default
  #    缺失时：先把 unmanned-store 项目 docker compose up -d 拉起，
  #    或手动创建：docker network create unmanned-store_default
  unmanned-store_default:
    external: true
